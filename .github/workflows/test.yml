name: Test

on:
  push:
    tags-ignore: ['v*']   # release.yml already tests on version tags
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: node --test

  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test package separation and integrity
        run: python -m unittest discover -s tests -p test_manual_build.py
      - name: Test Windows updater and recovery
        run: node --test tests/windows-updater.test.js
