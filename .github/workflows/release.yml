# Release workflow: push a tag like v1.3.3 and this submits that version to
# AMO (listed channel) and attaches store and Windows-manual packages.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WEB_EXT_API_KEY      AMO JWT issuer (user:12345678:123)
#   WEB_EXT_API_SECRET   AMO JWT secret
#   CWS_EXTENSION_ID     Chrome Web Store item id (from the listing URL)
#   CWS_CLIENT_ID        Google OAuth client id
#   CWS_CLIENT_SECRET    Google OAuth client secret
#   CWS_REFRESH_TOKEN    Google OAuth refresh token
name: Release

on:
  push:
    tags: ['v*']

jobs:
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_manual_build.py
      - run: node --test tests/windows-updater.test.js

  release:
    needs: windows-updater
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: node --test

      - name: Check tag matches manifest version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('nexus-addon/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest version $VERSION != tag $TAG" >&2
            exit 1
          fi

      - name: Build packages
        working-directory: nexus-addon
        run: python3 build.py

      # The store steps run only when their secrets exist, so a release
      # without store credentials still produces the GitHub release.
      - name: Build and submit to AMO (Firefox, listed)
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        working-directory: nexus-addon
        run: python3 build.py --sign

      - name: Publish to Chrome Web Store
        if: env.CWS_EXTENSION_ID != '' && env.CWS_REFRESH_TOKEN != ''
        working-directory: nexus-addon
        run: python3 build.py --chrome

      - name: Extract release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' nexus-addon/CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "Full changelog: https://github.com/DopeEx/NexusOverseer/blob/$GITHUB_REF_NAME/nexus-addon/CHANGELOG.md" >> release-notes.md
          test -s release-notes.md

      - name: Create GitHub release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            nexus-overseer-*.xpi nexus-overseer-*.zip
